<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prospector de Empresas</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="container">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-icon">🗺️</div>
    <h1>Prospector de Empresas</h1>
    <p>Encontre negócios sem site no Google Maps e prospecte via WhatsApp</p>
  </header>

  <!-- ===== BUSCA ===== -->
  <section class="card">
    <h2 class="card-title">Nova Busca</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="cidade">Cidade / Estado</label>
        <input id="cidade" type="text" placeholder="Ex: Goiânia, GO" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <input id="categoria" type="text" placeholder="Ex: barbearias, restaurantes" autocomplete="off" />
      </div>
      <button id="btn-buscar" class="btn btn-primary" onclick="iniciarBusca()">
        🔍 Buscar
      </button>
    </div>
  </section>

  <!-- ===== PROGRESSO ===== -->
  <section id="secao-progresso" class="card hidden">
    <div class="progresso-header">
      <span id="txt-progresso">Iniciando...</span>
      <span id="txt-contagem" class="contagem">0 / 0</span>
    </div>
    <div class="barra-bg">
      <div id="barra-fill" class="barra-fill" style="width:0%"></div>
    </div>
    <p id="txt-empresa" class="empresa-atual"></p>
  </section>

  <!-- ===== BARRA DE AÇÕES ===== -->
  <section id="secao-acoes" class="card hidden">
    <div class="acoes-row">
      <span id="txt-selecionados" class="selecionados-label">0 selecionados</span>
      <div class="acoes-btns">
        <button class="btn btn-secondary" onclick="selecionarTodos()">Selecionar Todos</button>
        <button class="btn btn-whatsapp" onclick="enviarSelecionados()">📱 Enviar WhatsApp</button>
        <button class="btn btn-excel" onclick="exportarExcel()">📊 Exportar Excel</button>
      </div>
    </div>
  </section>

  <!-- ===== RESULTADOS ===== -->
  <section id="secao-resultados" class="card hidden">
    <div class="resultados-header">
      <h2 class="card-title">
        Resultados
        <span id="badge-total" class="badge badge-azul">0</span>
      </h2>
      <label class="toggle-label">
        <input type="checkbox" id="chk-sem-site" onchange="filtrarTabela()" />
        Só sem site
      </label>
    </div>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="chk-todos" onchange="toggleCheckboxTodos(this)" /></th>
            <th>Nome</th>
            <th>Telefone</th>
            <th class="hide-mobile">Endereço</th>
            <th>Site</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>

    <div id="paginacao" class="paginacao"></div>
  </section>

  <!-- ===== HISTÓRICO ===== -->
  <section class="card">
    <div class="historico-topo">
      <h2 class="card-title">Histórico de Buscas</h2>
      <button class="btn btn-secondary btn-sm" onclick="carregarHistorico()">↻ Atualizar</button>
    </div>
    <div id="historico-lista">
      <p class="vazio">Nenhuma busca realizada ainda.</p>
    </div>
  </section>

</div><!-- /container -->

<script src="/app.js"></script>
</body>
</html>
