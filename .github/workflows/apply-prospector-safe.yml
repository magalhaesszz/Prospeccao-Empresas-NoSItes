name: Apply safe Prospector improvements

on:
  push:
    branches:
      - fix/prospector-groq-prospeccao

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected old-project branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require temporary patch payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/prospector_patch.gz.b64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode and validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/prospector_patch.gz.b64 | gzip -d > /tmp/prospector-safe.patch
          git apply --check /tmp/prospector-safe.patch
          git apply /tmp/prospector-safe.patch

      - name: Verify Python and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q requests
          python -m compileall -q app.py ai database scraper utils
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit only approved non-visual changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/prospector_patch.gz.b64
          git add -- \
            .env.example \
            config.py \
            app.py \
            ai/enricher.py \
            ai/runtime.py \
            database/db.py \
            scraper/google_maps.py \
            scraper/coverage.py \
            utils/__init__.py \
            utils/identity.py \
            tests/test_ai_runtime.py \
            tests/test_identity.py \
            tests/test_coverage.py
          git add -u -- .github/prospector_patch.gz.b64
          if git diff --cached --name-only | grep -E '^(frontend/|templates/)'; then
            echo 'ERRO: alteração visual detectada; abortando.' >&2
            exit 1
          fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: restore Groq and improve prospecting safely'
          git push origin HEAD:fix/prospector-groq-prospeccao
