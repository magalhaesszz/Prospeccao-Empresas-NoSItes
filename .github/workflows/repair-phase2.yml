name: Repair Prospector Phase 2

on:
  push:
    branches:
      - agent/reorganiza-nucleo-prospector

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganiza-nucleo-prospector
          fetch-depth: 0

      - name: Apply phase 2
        run: python scripts/repair_phase2.py

      - name: Validate syntax and diff
        run: |
          python -m compileall -q app.py config.py ai database scraper whatsapp crm dashboard export
          git diff --check

      - name: Commit phase 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py config.py .env.example whatsapp/disparar.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refactor: centraliza Evolution e endurece preflight"
            git push origin HEAD:agent/reorganiza-nucleo-prospector
          fi
