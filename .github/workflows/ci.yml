name: Prospector V2 CI
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prospector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prospector_test
      SECRET_KEY: ci-secret-key-not-for-production
      ADMIN_PASSWORD: ci-password
      WA_PROVIDER: disabled
      WA_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q app.py prospector scraper
      - name: Validate JavaScript
        id: javascript
        continue-on-error: true
        run: node --check frontend/v2.js
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: pytest
      - name: Smoke production app startup
        id: smoke
        continue-on-error: true
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()
          response = client.get('/healthz')
          assert response.status_code == 200, response.data
          assert response.get_json()['ok'] is True
          print(response.get_json())
          PY
      - name: Build production Docker image
        id: docker
        continue-on-error: true
        run: docker build --pull -t prospector-v2-ci .
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          JS_OUTCOME: ${{ steps.javascript.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
        run: |
          state=success
          description="tests + startup smoke + Docker build passed"
          if [ "$INSTALL_OUTCOME" != "success" ] || [ "$COMPILE_OUTCOME" != "success" ] || [ "$JS_OUTCOME" != "success" ] || [ "$PYTEST_OUTCOME" != "success" ] || [ "$SMOKE_OUTCOME" != "success" ] || [ "$DOCKER_OUTCOME" != "success" ]; then
            state=failure
            description="validation failed; inspect Actions logs"
          fi
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Prospector V2 CI\",\"description\":\"${description}\"}"
      - name: Fail job when validation failed
        if: steps.install.outcome != 'success' || steps.compile.outcome != 'success' || steps.javascript.outcome != 'success' || steps.pytest.outcome != 'success' || steps.smoke.outcome != 'success' || steps.docker.outcome != 'success'
        run: exit 1
