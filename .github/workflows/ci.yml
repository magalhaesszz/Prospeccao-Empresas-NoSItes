name: Prospector V2 CI
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prospector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prospector_test
      SECRET_KEY: ci-secret-key-not-for-production
      ADMIN_PASSWORD: ci-password
      WA_PROVIDER: disabled
      WA_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py prospector scraper
      - run: pytest
