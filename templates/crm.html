{% extends "base.html" %}
{% block title %}CRM — Prospector{% endblock %}

{% block content %}
<div class="container container-wide">

  <div class="page-header">
    <h1 class="page-title">CRM — Funil de Vendas</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="filtro-crm" type="text" placeholder="Nome, telefone, cidade..." class="input-filtro" oninput="filtrarCards()"/>
      <select id="filtro-cidade" class="input-filtro" onchange="filtrarCards()"><option value="">Todas as cidades</option></select>
      <select id="filtro-categoria" class="input-filtro" onchange="filtrarCards()"><option value="">Todos os segmentos</option></select>
      <select id="filtro-site" class="input-filtro" onchange="filtrarCards()">
        <option value="">Site: todos</option>
        <option value="sem">Sem site</option>
        <option value="com">Com site</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="limparFiltrosCrm()">Limpar</button>
      <button class="btn btn-secondary btn-sm" onclick="carregarKanban()">↻ Atualizar</button>
    </div>
  </div>

  <!-- Kanban board -->
  <div id="kanban-board" class="kanban-board"></div>

</div>

<!-- Painel de notas (slide lateral) -->
<div id="painel-notas" class="painel-notas">
  <div class="painel-header">
    <strong id="painel-nome">Empresa</strong>
    <button onclick="fecharPainel()" class="btn-fechar">✕</button>
  </div>

  <!-- Info da empresa -->
  <div id="painel-info" class="painel-info"></div>

  <!-- Status rápido -->
  <div class="painel-status">
    <label style="font-size:.8rem;color:var(--muted)">Mover para:</label>
    <div id="painel-status-btns" class="status-btns"></div>
  </div>

  <!-- Notas -->
  <div class="painel-notas-lista">
    <h3 style="font-size:.9rem;font-weight:600;margin-bottom:10px">Notas</h3>
    <div id="lista-notas"></div>
  </div>

  <div class="painel-add-nota">
    <textarea id="input-nota" rows="3" placeholder="Adicionar nota..." class="textarea-nota"></textarea>
    <button class="btn btn-primary btn-sm" onclick="adicionarNota()" style="width:100%;margin-top:6px">+ Adicionar Nota</button>
  </div>

  <!-- WhatsApp rápido + IA Follow-up -->
  <div class="painel-wa" style="border-top:1px solid var(--border)">
    <button id="btn-wa-painel" class="btn btn-whatsapp" style="width:100%;margin-bottom:8px" onclick="enviarWaPainel()">
      📱 Enviar WhatsApp
    </button>
    <button id="btn-followup-ia" class="btn btn-sm" style="width:100%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;padding:8px;font-size:.82rem" onclick="gerarFollowupIA()">
      ⚡ Gerar Follow-up com IA
    </button>
    <div id="followup-resultado" style="display:none;margin-top:10px">
      <textarea id="followup-texto" rows="6" style="width:100%;box-sizing:border-box;font-size:.8rem;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface-2);color:var(--text);font-family:inherit;resize:vertical"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-sm btn-secondary" style="flex:1" onclick="copiarFollowup()">Copiar</button>
        <button class="btn btn-sm btn-whatsapp" style="flex:1" onclick="enviarFollowupWa()">WhatsApp</button>
      </div>
    </div>
  </div>
</div>
<div id="overlay-painel" class="overlay-painel hidden" onclick="fecharPainel()"></div>
{% endblock %}

{% block scripts %}<script src="/crm.js"></script>{% endblock %}
