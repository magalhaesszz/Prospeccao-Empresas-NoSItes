{% extends "base.html" %}
{% block title %}Templates — Prospector{% endblock %}

{% block content %}
<div class="container">

  <div class="page-header">
    <h1 class="page-title">Templates de Mensagem</h1>
    <button class="btn btn-primary" onclick="abrirEditor()">+ Novo Template</button>
  </div>

  <p style="color:var(--muted);font-size:.875rem;margin-bottom:16px">
    Use <code>{NOME_DA_EMPRESA}</code> como variável na mensagem.
    O template marcado como <strong>ativo</strong> é usado nos disparos.
  </p>

  <div id="lista-templates"></div>

</div>

<!-- Modal de edição -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="fecharEditor()"></div>
<div id="modal-editor" class="modal-editor hidden">
  <div class="modal-header">
    <h2 id="modal-titulo">Novo Template</h2>
    <button onclick="fecharEditor()" class="btn-fechar">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-group" style="margin-bottom:12px">
      <label>Nome do Template</label>
      <input id="ed-nome" type="text" placeholder="Ex: Proposta Site Profissional"/>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Mensagem</label>
      <textarea id="ed-mensagem" rows="10" class="textarea-lote" placeholder="Olá, *{NOME_DA_EMPRESA}*!..."></textarea>
    </div>
    <div class="form-group">
      <label>Preview (com nome de exemplo)</label>
      <div id="ed-preview" class="preview-box"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="fecharEditor()">Cancelar</button>
    <button class="btn btn-primary"   onclick="salvarTemplate()">Salvar</button>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="/templates_page.js"></script>{% endblock %}
