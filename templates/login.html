<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prospector · Login</title><link rel="stylesheet" href="/assets/v2.css"></head><body class="login-body"><main class="login-card"><div class="logo-mark">P</div><h1>Prospector</h1><p class="muted">Acesse seu painel de prospecção.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}{% if auth_enabled %}<form method="post">{% if supabase_enabled %}<label>E-mail</label><input name="email" type="email" autocomplete="username" required>{% endif %}<label>Senha</label><input name="password" type="password" autocomplete="current-password" autofocus required><button class="primary wide" type="submit">Entrar</button></form>{% else %}<a class="button primary wide" href="/">Entrar</a>{% endif %}</main></body></html>
