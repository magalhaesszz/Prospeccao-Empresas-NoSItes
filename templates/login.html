<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Entrar — Prospector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#E11D48; --brand-d:#BE123C; --brand-l:#FB7185;
      --brand-glow:rgba(225,29,72,.35);
      --bg:#06050E;
      --card:rgba(255,255,255,.045);
      --border:rgba(255,255,255,.10);
      --text:#F8FAFC;
      --muted:rgba(248,250,252,.48);
      --muted-2:rgba(248,250,252,.30);
      --danger:#F87171;
      --ok:#34D399;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100dvh;
      background:var(--bg);
      color:var(--text);
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
      position:relative;overflow:hidden;
    }
    /* Glow de marca de fundo */
    body::before,body::after{
      content:"";position:fixed;border-radius:50%;filter:blur(90px);
      pointer-events:none;z-index:0;opacity:.55;
    }
    body::before{
      width:520px;height:520px;top:-180px;right:-120px;
      background:radial-gradient(circle,var(--brand-glow),transparent 70%);
      animation:flutua 14s ease-in-out infinite;
    }
    body::after{
      width:460px;height:460px;bottom:-200px;left:-140px;
      background:radial-gradient(circle,rgba(139,92,246,.22),transparent 70%);
      animation:flutua 18s ease-in-out infinite reverse;
    }
    @keyframes flutua{
      0%,100%{transform:translate(0,0)}
      50%{transform:translate(30px,40px)}
    }
    .login-wrap{
      width:100%;max-width:410px;position:relative;z-index:1;
      animation:surge .6s cubic-bezier(.16,1,.3,1);
    }
    @keyframes surge{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .login-brand{text-align:center;margin-bottom:30px}
    .login-icon{
      display:inline-flex;align-items:center;justify-content:center;
      width:70px;height:70px;margin-bottom:18px;
      background:linear-gradient(135deg,var(--brand),var(--brand-d));
      border-radius:20px;color:#fff;
      box-shadow:0 10px 30px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.25);
    }
    .login-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .login-brand h1{
      font-size:1.65rem;font-weight:800;letter-spacing:-.03em;margin-bottom:5px;
    }
    .login-brand p{font-size:.9rem;color:var(--muted)}
    .login-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:32px 28px;
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      box-shadow:0 24px 60px rgba(0,0,0,.45);
    }
    .campo{margin-bottom:18px}
    label{
      display:block;font-size:.72rem;font-weight:600;
      color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
      margin-bottom:9px;
    }
    .input-box{position:relative;display:flex;align-items:center}
    .input-box .ico{
      position:absolute;left:15px;display:flex;pointer-events:none;
      color:var(--muted-2);transition:color .2s;
    }
    .input-box .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    input{
      width:100%;padding:13px 15px 13px 44px;
      background:rgba(255,255,255,.05);
      border:1.5px solid var(--border);
      border-radius:12px;
      font-size:1rem;color:var(--text);outline:none;
      font-family:inherit;
      transition:border-color .2s,box-shadow .2s,background .2s;
    }
    input::placeholder{color:var(--muted-2)}
    input:focus{
      border-color:var(--brand);
      background:rgba(255,255,255,.07);
      box-shadow:0 0 0 4px rgba(225,29,72,.15);
    }
    .input-box:focus-within .ico{color:var(--brand)}
    .toggle-senha{
      position:absolute;right:8px;
      background:none;border:none;cursor:pointer;
      color:var(--muted-2);padding:8px;border-radius:8px;
      display:flex;transition:color .2s,background .2s;
    }
    .toggle-senha:hover{color:var(--muted);background:rgba(255,255,255,.06)}
    .toggle-senha svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .btn-entrar{
      width:100%;margin-top:8px;padding:14px;
      background:linear-gradient(135deg,var(--brand),var(--brand-d));
      color:#fff;border:none;border-radius:12px;
      font-size:1rem;font-weight:700;cursor:pointer;
      font-family:inherit;letter-spacing:.01em;
      transition:transform .18s,box-shadow .18s,opacity .18s;
      box-shadow:0 8px 22px var(--brand-glow);
      display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;
    }
    .btn-entrar:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px var(--brand-glow)}
    .btn-entrar:active:not(:disabled){transform:translateY(0)}
    .btn-entrar:disabled{opacity:.7;cursor:not-allowed}
    .spinner{
      width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);
      border-top-color:#fff;border-radius:50%;animation:girar .7s linear infinite;
    }
    @keyframes girar{to{transform:rotate(360deg)}}
    .msg{
      margin-top:16px;padding:11px 14px;border-radius:10px;
      font-size:.86rem;text-align:center;display:none;line-height:1.4;
    }
    .msg.erro{color:var(--danger);background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.25)}
    .msg.mostra{display:block;animation:tremor .35s}
    @keyframes tremor{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .login-foot{text-align:center;margin-top:22px;font-size:.78rem;color:var(--muted-2)}
    @media (max-width:420px){
      .login-card{padding:26px 20px}
      .login-brand h1{font-size:1.45rem}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }

    /* ===== PIXEL / RETRO override ===== */
    :root{--brand:#ff2e63;--brand-d:#c81e4a;--brand-l:#ff6b91;--brand-glow:rgba(255,46,99,.5);--bg:#0d0620}
    body{font-family:'VT323',monospace;font-size:18px;
      background-image:
        repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 2px,transparent 2px 4px),
        linear-gradient(rgba(180,107,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(180,107,255,.05) 1px,transparent 1px);
      background-size:100% 4px,32px 32px,32px 32px;}
    svg{shape-rendering:crispEdges}
    .login-icon{border-radius:0;border:3px solid #000;box-shadow:5px 5px 0 rgba(0,0,0,.5)}
    .login-brand h1{font-family:'Press Start 2P',monospace;font-size:1.05rem;line-height:1.5;
      color:#fff;text-shadow:0 0 8px var(--brand-glow)}
    .login-brand p{font-size:1.05rem}
    .login-card{border-radius:0;border:3px solid var(--brand);box-shadow:8px 8px 0 rgba(0,0,0,.6);backdrop-filter:none;background:#180f30}
    label{font-family:'Press Start 2P',monospace;font-size:.52rem;line-height:1.6}
    input{border-radius:0;border:3px solid #3a2a63;background:#120a26;font-size:1.05rem}
    input:focus{box-shadow:0 0 0 3px var(--brand-glow)}
    .btn-entrar{border-radius:0;border:3px solid #000;box-shadow:4px 4px 0 #000;
      font-family:'Press Start 2P',monospace;font-size:.72rem;text-transform:uppercase}
    .btn-entrar:hover:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
    .btn-entrar:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 #000}
    .msg{border-radius:0}
    .msg.erro{border:2px solid rgba(248,113,113,.4)}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="login-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <circle cx="11" cy="11" r="3"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <h1>Prospector</h1>
    <p>Acesse seu painel de prospecção</p>
  </div>

  <form class="login-card" id="form-login" autocomplete="on" novalidate>
    <div class="campo">
      <label for="email">E-mail</label>
      <div class="input-box">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        </span>
        <input id="email" name="email" type="email" inputmode="email"
          autocomplete="username" placeholder="voce@empresa.com" required autofocus/>
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="input-box">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input id="senha" name="senha" type="password"
          autocomplete="current-password" placeholder="••••••••" required/>
        <button type="button" class="toggle-senha" id="btn-toggle" aria-label="Mostrar senha">
          <svg id="olho" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-entrar" type="submit" id="btn-entrar">
      <span id="btn-label">Entrar</span>
    </button>

    <p id="msg" class="msg erro"></p>
  </form>
</div>

<script>
  const form   = document.getElementById('form-login');
  const btn    = document.getElementById('btn-entrar');
  const label  = document.getElementById('btn-label');
  const msg    = document.getElementById('msg');
  const inputSenha = document.getElementById('senha');

  // Mostrar/ocultar senha
  document.getElementById('btn-toggle').addEventListener('click', () => {
    const escondido = inputSenha.type === 'password';
    inputSenha.type = escondido ? 'text' : 'password';
    document.getElementById('olho').innerHTML = escondido
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    document.getElementById('btn-toggle').setAttribute('aria-label', escondido ? 'Ocultar senha' : 'Mostrar senha');
  });

  function mostrarErro(texto){
    msg.textContent = texto;
    msg.classList.remove('mostra'); void msg.offsetWidth; // reinicia animação
    msg.classList.add('mostra');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const senha = inputSenha.value;
    if (!email || !senha){ mostrarErro('Preencha e-mail e senha.'); return; }

    btn.disabled = true;
    label.textContent = 'Entrando';
    const spin = document.createElement('span');
    spin.className = 'spinner';
    btn.prepend(spin);
    msg.classList.remove('mostra');

    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });
      const dados = await resp.json().catch(() => ({}));
      if (resp.ok) {
        label.textContent = 'Bem-vindo!';
        try{
          const c=new (window.AudioContext||window.webkitAudioContext)();
          [[523,0],[659,.09],[784,.18],[1046,.27]].forEach(([f,d])=>{
            const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+d;
            o.type='square';o.frequency.setValueAtTime(f,t);
            g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
            o.connect(g).connect(c.destination);o.start(t);o.stop(t+.12);
          });
          setTimeout(()=>location.href='/',380); return;
        }catch(_){}
        location.href = '/';
        return;
      }
      mostrarErro(dados.erro || 'E-mail ou senha incorretos.');
    } catch (err) {
      mostrarErro('Falha de conexão. Tente novamente.');
    } finally {
      if (!location.href.endsWith('/')) {
        btn.disabled = false;
        spin.remove();
        label.textContent = 'Entrar';
      }
    }
  });
</script>
</body>
</html>
