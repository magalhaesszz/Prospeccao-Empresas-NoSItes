{% extends "base.html" %}
{% block title %}Blacklist — Prospector{% endblock %}

{% block content %}
<div class="container">

  <div class="page-header">
    <h1 class="page-title">Blacklist — Números Bloqueados</h1>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h2 class="card-title">Adicionar Número</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Telefone (formato: +5562999999999)</label>
        <input id="bl-telefone" type="tel" inputmode="tel" placeholder="+5562999999999"/>
      </div>
      <div class="form-group">
        <label>Motivo (opcional)</label>
        <input id="bl-motivo" type="text" placeholder="Ex: Pediu para não contatar"/>
      </div>
      <button class="btn btn-primary" onclick="adicionarBl()">Bloquear</button>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">Números Bloqueados <span id="bl-count" class="badge badge-vermelho">0</span></h2>
    <div class="tabela-wrapper">
      <table>
        <thead><tr><th>Telefone</th><th>Motivo</th><th>Data</th><th>Ação</th></tr></thead>
        <tbody id="bl-tabela"></tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
async function carregarBl(){
  const resp = await fetch('/api/blacklist');
  const dados = await resp.json();
  document.getElementById('bl-count').textContent = dados.length;
  const tb = document.getElementById('bl-tabela');
  tb.innerHTML = dados.length === 0
    ? '<tr><td colspan="4" class="vazio">Nenhum número bloqueado.</td></tr>'
    : dados.map(r=>`
        <tr>
          <td>${esc(r.telefone)}</td>
          <td>${esc(r.motivo||'—')}</td>
          <td style="font-size:.8rem;color:var(--muted)">${fmtData(r.adicionado_em)}</td>
          <td><button class="btn btn-sm btn-secondary" onclick="removerBl(${r.id})">Remover</button></td>
        </tr>`).join('');
}
async function adicionarBl(){
  const tel    = document.getElementById('bl-telefone').value.trim();
  const motivo = document.getElementById('bl-motivo').value.trim();
  if(!tel){ alert('Informe o telefone.'); return; }
  const resp = await fetch('/api/blacklist',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({telefone:tel, motivo})
  });
  const d = await resp.json();
  if(d.duplicado){ mostrarToast('Número já estava na blacklist.','warning'); }
  else { mostrarToast('Número bloqueado!','success'); }
  document.getElementById('bl-telefone').value='';
  document.getElementById('bl-motivo').value='';
  carregarBl();
}
async function removerBl(id){
  await fetch(`/api/blacklist/${id}`,{method:'DELETE'});
  mostrarToast('Removido da blacklist.','info');
  carregarBl();
}
function esc(t){ const d=document.createElement('div'); d.appendChild(document.createTextNode(String(t||''))); return d.innerHTML; }
function fmtData(s){ try{ return new Date(s).toLocaleDateString('pt-BR'); } catch(_){ return s||''; } }
document.addEventListener('DOMContentLoaded', carregarBl);
</script>
{% endblock %}
