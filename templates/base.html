<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>{% block title %}Prospector{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"/>
  {% block head %}{% endblock %}
</head>
<body>

<!-- CRT overlay (scanlines + flicker + vinheta) -->
<div class="crt-overlay" aria-hidden="true"></div>

<!-- Floating Background Icons -->
<div class="bg-floats" aria-hidden="true">
  <!-- WhatsApp / Mensagem -->
  <div class="bg-f bg-f1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="170" height="170">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>
    </svg>
  </div>
  <!-- Rocket / Disparo -->
  <div class="bg-f bg-f2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="95" height="95">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </svg>
  </div>
  <!-- Target / Mira -->
  <div class="bg-f bg-f3">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="210" height="210">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    </svg>
  </div>
  <!-- Zap / Lightning -->
  <div class="bg-f bg-f4">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="65" height="65">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
  </div>
  <!-- BarChart -->
  <div class="bg-f bg-f5">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="130" height="130">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6"  y1="20" x2="6"  y2="14"/>
      <line x1="2"  y1="20" x2="22" y2="20"/>
    </svg>
  </div>
  <!-- Send arrow -->
  <div class="bg-f bg-f6">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="85" height="85">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <circle cx="11" cy="11" r="3"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <div class="sidebar-logo-text">
      <span class="sidebar-logo-name">Prospector</span>
      <span class="sidebar-logo-tag">Sistema Inteligente</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Menu</div>

    <a href="/" class="sidebar-item {{ 'active' if page=='busca' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M3 3h9v9H3V3Zm2 2v5h5V5H5Zm7 7h2v2h2v2h2v2h-2v-2h-2v-2h-2v-2Z"/></svg>
      </span>
      <span class="sidebar-label">Busca</span>
    </a>

    <a href="/crm" class="sidebar-item {{ 'active' if page=='crm' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3Zm10 0h8v8h-8V3ZM3 13h8v8H3v-8Zm10 0h8v8h-8v-8Z"/></svg>
      </span>
      <span class="sidebar-label">CRM</span>
    </a>

    <a href="/dashboard" class="sidebar-item {{ 'active' if page=='dashboard' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 12h4v8H4v-8Zm6-6h4v14h-4V6Zm6 3h4v11h-4V9Z"/></svg>
      </span>
      <span class="sidebar-label">Dashboard</span>
    </a>

    <a href="/templates" class="sidebar-item {{ 'active' if page=='templates' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v11H9l-4 4v-4H3V4Z"/></svg>
      </span>
      <span class="sidebar-label">Templates</span>
    </a>

    <a href="/blacklist" class="sidebar-item {{ 'active' if page=='blacklist' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2l9 3v6c0 6-9 10-9 10s-9-4-9-10V5l9-3Zm-5 8v3h10v-3H7Z"/></svg>
      </span>
      <span class="sidebar-label">Blacklist</span>
    </a>

    <a href="/whatsapp" class="sidebar-item {{ 'active' if page=='whatsapp' }}">
      <span class="sidebar-icon">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 3h16v12h-9l-4 4v-4H4V3Z"/></svg>
      </span>
      <span class="sidebar-label">WhatsApp</span>
    </a>

    <a href="/gemini" class="sidebar-item {{ 'active' if page=='gemini' }}" style="background:{{ 'linear-gradient(135deg,rgba(66,133,244,.18),rgba(52,168,83,.12))' if page=='gemini' else '' }}">
      <span class="sidebar-icon" style="color:{{ '#00f0ff' if page!='gemini' else 'inherit' }}">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l10 5-10 5L2 7l10-5Zm-8.5 8.2L12 14.5l8.5-4.3 1.5.8-10 5-10-5 1.5-.8Z"/></svg>
      </span>
      <span class="sidebar-label">IA Hub</span>
      <span style="font-size:.5rem;font-family:var(--font-pixel);background:var(--neon-cyan);color:#000;padding:3px 5px;border-radius:0;margin-left:auto;line-height:1;border:1px solid #000">PRO</span>
    </a>

    <div class="sidebar-phrase">Prospecte &middot; Conecte &middot; Venda</div>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-sfx-row">
      <button class="sfx-toggle" id="sfx-toggle" onclick="toggleMute()" title="Som" aria-label="Ligar/desligar som"></button>
    </div>
    <div class="user-box" id="user-box" style="display:none">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <span class="user-email" id="user-email">—</span>
        <span class="user-role">Sessão ativa</span>
      </div>
      <button class="user-logout" onclick="logout()" title="Sair" aria-label="Sair">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay hidden" id="sidebar-overlay" onclick="fecharSidebar()"></div>

<!-- Mobile top bar -->
<header class="mobile-header">
  <button class="hamburger" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="mobile-title">Prospector</span>
  <button class="sfx-toggle" id="sfx-toggle-mobile" onclick="toggleMute()" title="Som" aria-label="Ligar/desligar som"></button>
</header>

<!-- Main -->
<main class="main-content">
  <div class="page-content">
    {% block content %}{% endblock %}
  </div>
</main>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav">
  <div class="bottom-nav-items">
    <a href="/"          class="bottom-nav-item {{ 'active' if page=='busca' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M3 3h9v9H3V3Zm2 2v5h5V5H5Zm7 7h2v2h2v2h2v2h-2v-2h-2v-2h-2v-2Z"/></svg></span>
      <span>Busca</span>
    </a>
    <a href="/crm"       class="bottom-nav-item {{ 'active' if page=='crm' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3Zm10 0h8v8h-8V3ZM3 13h8v8H3v-8Zm10 0h8v8h-8v-8Z"/></svg></span>
      <span>CRM</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item {{ 'active' if page=='dashboard' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 12h4v8H4v-8Zm6-6h4v14h-4V6Zm6 3h4v11h-4V9Z"/></svg></span>
      <span>Board</span>
    </a>
    <a href="/templates" class="bottom-nav-item {{ 'active' if page=='templates' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v11H9l-4 4v-4H3V4Z"/></svg></span>
      <span>Templates</span>
    </a>
    <a href="/blacklist" class="bottom-nav-item {{ 'active' if page=='blacklist' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2l9 3v6c0 6-9 10-9 10s-9-4-9-10V5l9-3Zm-5 8v3h10v-3H7Z"/></svg></span>
      <span>Blacklist</span>
    </a>
    <a href="/whatsapp"  class="bottom-nav-item {{ 'active' if page=='whatsapp' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 3h16v12h-9l-4 4v-4H4V3Z"/></svg></span>
      <span>WhatsApp</span>
    </a>
    <a href="/gemini" class="bottom-nav-item {{ 'active' if page=='gemini' }}">
      <span class="bnav-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l10 5-10 5L2 7l10-5Zm-8.5 8.2L12 14.5l8.5-4.3 1.5.8-10 5-10-5 1.5-.8Z"/></svg></span>
      <span>IA</span>
    </a>
  </div>
</nav>

<div id="toast" class="toast oculto"></div>

<script>
// Sessão expirada (401): manda pro login automaticamente
(function(){
  const _fetch=window.fetch;
  window.fetch=function(...args){
    return _fetch.apply(this,args).then(resp=>{
      if(resp.status===401 && !location.pathname.startsWith('/login')){
        location.href='/login';
      }
      return resp;
    });
  };
})();
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  const open=sb.classList.toggle('open');
  open?ov.classList.remove('hidden'):ov.classList.add('hidden');
}
function fecharSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.add('hidden');
}
async function logout(){
  await fetch('/api/logout',{method:'POST'});
  location.href='/login';
}
function mostrarToast(msg,tipo='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+tipo;
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.className='toast oculto',3500);
  if(window.SFX){ if(tipo==='success')SFX.success(); else if(tipo==='error')SFX.error(); else if(tipo==='warning')SFX.warn(); }
}

/* ===== Motor de som 8-bit (Web Audio, sem arquivos) ===== */
window.SFX=(function(){
  let ctx=null, muted=localStorage.getItem('sfxMuted')==='1';
  const vol=0.06;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } return ctx; }
  function tone(freq,dur,type='square',slide=0){
    if(muted)return;
    const c=ac(); if(!c)return;
    if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(60,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur);
  }
  function seq(notes){ let d=0; notes.forEach(n=>{ setTimeout(()=>tone(n[0],n[1],n[2]||'square',n[3]||0),d*1000); d+=n[1]; }); }
  return {
    click:()=>tone(420,0.05,'square'),
    hover:()=>tone(680,0.03,'triangle'),
    send: ()=>seq([[520,0.05],[780,0.08]]),
    success:()=>seq([[523,0.07],[659,0.07],[784,0.12]]),
    error:()=>seq([[300,0.1,'sawtooth',-140],[180,0.16,'sawtooth',-60]]),
    warn: ()=>seq([[440,0.08,'square'],[440,0.08,'square']]),
    isMuted:()=>muted,
    setMuted:(m)=>{ muted=m; localStorage.setItem('sfxMuted',m?'1':'0'); }
  };
})();

function _sfxIcon(m){
  return m
    ? '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h4l5-5v16l-5-5H3V9Z"/><path stroke="currentColor" stroke-width="2" d="M16 9l5 6M21 9l-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h4l5-5v16l-5-5H3V9Z"/><path stroke="currentColor" stroke-width="2" fill="none" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
}
function _renderMute(){
  const m=SFX.isMuted();
  document.querySelectorAll('.sfx-toggle').forEach(b=>{
    b.innerHTML=_sfxIcon(m);
    b.classList.toggle('muted',m);
    b.title=m?'Som desligado':'Som ligado';
  });
}
function toggleMute(){ SFX.setMuted(!SFX.isMuted()); if(!SFX.isMuted())SFX.click(); _renderMute(); }

document.addEventListener('DOMContentLoaded',()=>{
  _renderMute();
  // Clique em elementos interativos
  document.addEventListener('click',(e)=>{
    const el=e.target.closest('button,.sidebar-item,.bottom-nav-item,.btn-card,.btn-pag,.wa-chat-item,summary');
    if(!el||el.classList.contains('sfx-toggle'))return;
    if(el.matches('.btn-whatsapp,.wa-chat-enviar')||el.closest('.btn-whatsapp')) SFX.send();
    else SFX.click();
  },true);
  // Hover na navegação (desktop)
  if(window.matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.sidebar-item,.bottom-nav-item').forEach(el=>{
      el.addEventListener('mouseenter',()=>SFX.hover());
    });
  }
});
fetch('/api/status').then(r=>r.json()).then(d=>{
  if(d&&d.autenticado){
    const email=d.email||'Sessão ativa';
    const em=document.getElementById('user-email');
    const av=document.getElementById('user-avatar');
    const box=document.getElementById('user-box');
    if(em){em.textContent=email;em.title=email;}
    if(av)av.textContent=(email.trim()[0]||'U').toUpperCase();
    if(box)box.style.display='';
  }
}).catch(()=>{});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
